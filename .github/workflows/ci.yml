name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --pull --tag uklok/browser:test .

      - name: Start browser
        run: |
          docker run --detach \
            --name uklok-browser-smoke \
            --shm-size=2g \
            --publish 127.0.0.1:6080:6080 \
            --publish 127.0.0.1:9222:9222 \
            --volume uklok-browser-smoke-profile:/data/chrome \
            uklok/browser:test

      - name: Wait for container health
        run: |
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' uklok-browser-smoke)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs uklok-browser-smoke
              exit 1
            fi
            sleep 2
          done

          docker logs uklok-browser-smoke
          exit 1

      - name: Smoke test shared browser surfaces
        run: ./tests/smoke.sh uklok-browser-smoke

      - name: Container logs
        if: always()
        run: docker logs uklok-browser-smoke || true

      - name: Cleanup
        if: always()
        run: |
          docker rm --force uklok-browser-smoke || true
          docker volume rm uklok-browser-smoke-profile || true

  publish:
    if: github.event_name == 'push'
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
