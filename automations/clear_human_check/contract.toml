schema = "uklok.browser.automation/v1"
id = "clear_human_check"
version = 1
status = "ready"
intent = "On the already visible tab, click the human-check checkbox and wait until the page behind it is showing."
module = "run.py"

[trigger]
description = "The visible tab is stopped on a human-check interstitial and a caller wants that same tab to show the page behind it."

[authority]
allowed = [
  "Attach the page tab that is already visible.",
  "Click the verify checkbox inside the human-check widget on that tab.",
  "Wait for that tab to show the page behind the interstitial.",
]
forbidden = [
  "Open a new tab.",
  "Navigate, reload, or change the tab URL.",
  "Read, copy, or replay the turnstile response token.",
  "Call an external solver.",
  "Type credentials.",
  "Submit a form on the page behind the interstitial.",
]

[[preconditions]]
id = "browser_ready"
condition = "UKLOK Browser is healthy and Browser Use is attached through BU_CDP_URL to the existing Chrome. Do not launch another browser."

[[preconditions]]
id = "visible_tab"
condition = "The human's current page is already open and visible. This run does not choose a different URL."

[[algorithm]]
id = "attach_visible_tab"
pseudocode = """
FIND the page tab whose document is visible.
ATTACH that tab.
DO NOT activate a hidden tab.
DO NOT open a tab.
DO NOT navigate.
"""
checkpoint = "The attached tab is a visible page, and its URL is recorded."
on_failure = "Stop. A hidden tab is not the page the human is looking at."
resume = "safe"
known_variants = [
  "Browser Use may be attached to a hidden tab from an earlier run. Visibility, not attachment order, chooses the tab.",
]

[[algorithm]]
id = "click_verify"
pseudocode = """
IF the attached document is already the page behind the interstitial, do nothing.
An interstitial has a title of "Just a moment..." or a title that starts with "Challenge", or a Turnstile iframe.
The iframe src contains challenges.cloudflare.com and turnstile.
Page querySelector does not see that iframe. The pierced DOM does.
A hidden status node may say "Verification successful. Waiting for www.upwork.com to respond" while the checkbox is still on screen. That text is not success.
WAIT until the iframe has a box. A missing box, including "Could not compute box model.", is not a click.
The hidden status text does not replace that checkbox. Click while the box is present.
CLICK once, about 28px from the iframe's left edge and vertically centered.
WAIT for the interstitial to leave. Verification can stay on "Just a moment..." while it finishes.
CLICK a second time only if the checkbox box is still present after that wait.
WAIT until the interstitial title is gone and the Turnstile iframe is gone.
DO NOT read the hidden cf-turnstile-response input.
"""
checkpoint = "The attached tab's title is not an interstitial title, and the Turnstile iframe is gone."
on_failure = "Stop on this tab. Do not reload it and do not invent a token."
resume = "safe"
known_variants = [
  "The checkbox lives in a cross-origin iframe. A coordinate click on the iframe box reaches it.",
  "The iframe node can exist before it has a box. That is not yet the checkbox.",
  "A second click while verification is still running puts the checkbox back.",
  "The document title can be empty, or unreadable, while the page behind the interstitial replaces the document.",
]

[success]
condition = "The visible tab shows the page that was behind the human check."

[failure]
capture_screenshot = true
agent_skill = ".agents/skills/browser-automation/SKILL.md"
